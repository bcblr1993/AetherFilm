name: Build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-tests:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test Mac runner failure handling without UI
        run: python3 -B -m unittest discover -s scripts/tests -p test_macos_playback.py
      - run: xcodebuild -version && swift --version
      - name: Prepare isolated SMB fixture
        run: |
          python3 -m venv .build/test-venv
          .build/test-venv/bin/python -m pip install -r scripts/test-requirements.txt
      - name: Test domain, persistence and real SMB2
        run: .build/test-venv/bin/python scripts/test_smb_integration.py -- swift test --package-path Packages/AetherFilmKit
  platform-builds:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build tools and synthetic media
        run: |
          brew install xcodegen ffmpeg
          python3 scripts/generate_ui_fixtures.py
          python3 PlaybackTests/generate_fixtures.py
          python3 PlaybackTests/generate_smb_fixture.py
          python3 PlaybackTests/generate_4k_fixture.py
          python3 -m venv .build/test-venv
          .build/test-venv/bin/python -m pip install -r scripts/test-requirements.txt
          xcodegen generate
      - name: macOS app and test bundles
        run: xcodebuild build-for-testing -project AetherFilm.xcodeproj -scheme AetherFilm-macOS -destination 'platform=macOS,arch=arm64' -derivedDataPath build/Mac -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO
      - name: iOS Simulator app and test bundles
        run: xcodebuild build-for-testing -project AetherFilm.xcodeproj -scheme AetherFilm-iOS -destination 'generic/platform=iOS Simulator' -derivedDataPath build/iOS -clonedSourcePackagesDirPath build/SourcePackages ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: iOS device build
        run: xcodebuild build -project AetherFilm.xcodeproj -scheme AetherFilm-iOS -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build/Device -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO
      - name: iOS playback, persistence and real SMB stream
        run: .build/test-venv/bin/python scripts/test_simulator_playback.py --products build/iOS/Build/Products --result build/Playback.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: build/Logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-results
          path: build/Playback.xcresult
          if-no-files-found: ignore
  macos26-playback:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record the minimum-system environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          stat -f '%u %Su' /dev/console
      - name: Prepare build tools and synthetic media
        run: |
          brew install xcodegen ffmpeg
          python3 scripts/generate_ui_fixtures.py
          python3 PlaybackTests/generate_fixtures.py
          python3 PlaybackTests/generate_smb_fixture.py
          python3 PlaybackTests/generate_4k_fixture.py
          python3 -m venv .build/test-venv
          .build/test-venv/bin/python -m pip install -r scripts/test-requirements.txt
          xcodegen generate
      - name: Build and sign the Mac test products with the installed toolchain
        run: >-
          xcodebuild build-for-testing -project AetherFilm.xcodeproj
          -scheme AetherFilm-macOS -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/Mac26 -clonedSourcePackagesDirPath build/SourcePackages
          ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER=''
      - name: Real Mac26 playback, persistence and SMB in Aqua
        run: >-
          .build/test-venv/bin/python scripts/test_smb_integration.py
          --bootstrap-only --media-folder .build/PlaybackFixtures --
          .build/test-venv/bin/python scripts/test_macos_playback.py
          --products build/Mac26/Build/Products --result build/Mac26Playback/Results.xcresult
          --require-os-major 26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos26-playback-results
          path: |
            build/Mac26Playback
            build/Mac26/Logs
          if-no-files-found: ignore

# Platform builds do not certify real playback or release readiness.
# Desktop UI tests run in the dedicated macos27 VM and real iPhone acceptance
# is recorded separately in docs/TEST_MATRIX.md before publication.
